# Local dev stack. Nothing here is shared with any other project: own network, own volumes, own ports.
name: search-platform

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["redpanda-data:/var/lib/redpanda/data"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fault injection. Services under test connect THROUGH these proxies in the `chaos` profile.
  # Proxy definitions are created at runtime by tests/failure (HTTP API on :8474).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["chaos"]
    ports:
      - "8474:8474"      # control API
      - "16333:16333"    # -> qdrant
      - "16379:16379"    # -> redis
      - "18080:18080"    # -> stub LLM

  stub-llm:
    # Deterministic OpenAI-compatible stub used by tests, benchmarks and standalone runs (built in the RAG PR).
    profiles: ["stub"]
    build: { context: ../.., dockerfile: deploy/compose/stub-llm.Dockerfile }
    ports: ["8089:8089"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search_dev_only
      POSTGRES_DB: search
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U search -d search"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: motoserver/moto:5.2.3
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: search
      DB_PASSWORD: search_dev_only
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
    ports: ["127.0.0.1:6432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redpanda-data:
  qdrant-data:
  postgres-data:
