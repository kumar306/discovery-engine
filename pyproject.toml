[project]
name = "search-platform"
version = "0.1.0"
description = "Streaming ingestion, hybrid retrieval, learned ranking, RAG with citations, Spark analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "orjson>=3.10",
    "aiokafka>=0.11",
    "qdrant-client>=1.17,<1.18",  # same minor as the server image, conditional upserts need >= 1.16
    "redis>=5.0",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.3.6",
    "boto3>=1.43.111",
]

[dependency-groups]
# CPU ML stack: ONNX embeddings, BM25 tokenizer, cross-encoder, LambdaMART
ml = [
    "fastembed>=0.4",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
]
# Spark 3.5.x on purpose: EMR Serverless 7.x ships Spark 3.5
spark = [
    "pyspark>=3.5,<3.6",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.110",
    "testcontainers>=4.8",
    "schemathesis>=3.35",
    "types-redis",
    "pandas-stubs",
    "boto3-stubs[s3]>=1.43.111",
]
loadtest = [
    "locust>=2.31",
]
eval = [
    "ir-measures>=0.3",      # independent nDCG/MRR implementation to cross-check our own metrics
    "datasets>=2.20",
]

[tool.uv]
default-groups = ["ml", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "libs", "analytics", "eval", "loadtest"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]   # working notes and scratch experiments, not project code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT"]
ignore = ["S101"]            # asserts are fine in tests; app code rule enforced in review
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["services", "libs", "analytics", "eval", "loadtest"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "fastembed.*", "lightgbm.*", "pyspark.*", "locust.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs the compose stack (Postgres, PgBouncer, Moto, Redpanda), run make up first",
    "failure: fault-injection tests through Toxiproxy",
    "spark: needs a local Spark session (run in Docker on Windows)",
    "eval: retrieval-quality regression gate",
    "crash: kill the worker at every call and check recovery, slow, run with make test-crash",
]
addopts = "-ra --strict-markers -m 'not integration and not failure and not spark and not eval'"
