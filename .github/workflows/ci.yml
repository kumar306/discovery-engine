name: ci

# a push that only changes documentation runs nothing, the jobs are for code
# the branch ci/** is only here while this workflow is being worked on, it is removed before the merge
on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# the jobs only read the repository, so the token gets no other right
permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv run and uv sync fail when uv.lock does not match pyproject.toml, instead of quietly changing it
  UV_LOCKED: "1"

jobs:
  # lint, types and the unit tests: no Docker, no network services
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # both actions are pinned to the commit of an exact release, a tag can be moved, a commit cannot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # the same uv as on the laptop
          version: "0.12.24"
          enable-cache: true
      - name: install the locked dependencies
        run: uv sync
      # make test = ruff check, ruff format --check, mypy --strict, then the unit tests
      - name: lint, types and unit tests
        run: make test

  # the integration and crash tests on the same compose stack as make up, a real postgres, kafka,
  # qdrant and s3, it starts only when the cheap job above has passed
  integration:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # where fastembed keeps the models it downloads, so the cache step can save and restore them
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
      - name: install the locked dependencies
        run: uv sync
      # two tests load the real models from hugging face, about 130 MB, the key is a fixed text
      # that is changed by hand when the model in the settings changes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fastembed-cache
          key: fastembed-bge-small-en-v1.5-bm25-1
      # make init = start the stack and wait for it to be healthy, create the topics, then the
      # tables, the bucket and the collection
      - name: start the stack and prepare it
        run: make init
      - name: integration tests
        run: make test-integration
      # after the integration tests, not beside them, both use the same collection
      - name: crash tests
        run: make test-crash
      - name: state of the stack after a failure
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml ps
          docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=100
